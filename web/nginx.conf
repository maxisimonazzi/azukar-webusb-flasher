# Sirve la SPA tal como quedó en la imagen. Si el build usó BASE_PATH, el árbol
# vive en /usr/share/nginx/html<BASE_PATH>/ y estas reglas valen igual: no hay
# prefijo escrito acá. La app no tiene router, así que no hace falta fallback SPA.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # WASM y chipdbs de YoWASP: pesados, con hash en el nombre del paquete.
    location ~ /yowasp/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        types {
            application/wasm wasm;
            application/javascript js;
            application/octet-stream tar;
        }
    }

    # Assets con hash de Vite.
    location ~ /assets/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # El service worker y el manifest no se cachean: si el navegador se queda
    # con un sw.js viejo, la app queda clavada en la versión que ese SW sirve.
    location ~ /(sw\.js|manifest\.webmanifest)$ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        types {
            application/javascript js;
            application/manifest+json webmanifest;
        }
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
