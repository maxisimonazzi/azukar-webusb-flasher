server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 320k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # DNS de Compose en cada request: web puede arrancar si toolchain está stopped.
    location /compile {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $compile_upstream toolchain;
        proxy_pass http://$compile_upstream:8090/compile;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Content-Type $content_type;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering on;
    }

    location /yowasp/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        types {
            application/wasm wasm;
            application/javascript js;
            application/octet-stream tar;
        }
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
