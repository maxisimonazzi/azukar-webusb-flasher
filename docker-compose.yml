# Un compose, un servicio: la SPA con nginx. La síntesis corre en el navegador (YoWASP/WASM).
#   copy .env.example .env
#   docker compose up --build -d
#
# Proyecto Docker: lattice-yowasp-* (no pisa lattice-webusb-flasher-* en :8080).

name: lattice-yowasp

services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_ALLOWED_IMPORT_EXTENSIONS: ${ALLOWED_IMPORT_EXTENSIONS:-v,pcf,txt}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-9090}:80"
