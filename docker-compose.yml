# Producción local y VPS: un solo comando.
#   docker compose up --build -d
# Abrí http://localhost:8080 en Chrome o Edge (WebUSB no vive en Firefox).
#
# toolchain  = Yosys + nextpnr-ice40 + icepack (Debian Trixie).
# web        = SPA + nginx. El USB lo habla el navegador de ESTA máquina,
#              nunca el contenedor.

name: azukar-webusb-flasher

services:
  toolchain:
    build:
      context: .
      dockerfile: toolchain/Dockerfile
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 64
    tmpfs:
      - /tmp:size=256m,mode=1777

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - toolchain
