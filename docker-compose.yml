# Producción local y VPS: un solo comando.
#   docker compose up --build -d
# Abrí http://localhost:8080 en Chrome o Edge (WebUSB no vive en Firefox).
#
# toolchain  = Yosys + nextpnr-ice40 + icepack + HTTP /compile (stdlib).
# web        = SPA + nginx. El USB lo habla el navegador de ESTA máquina,
#              nunca el contenedor. nginx proxea /compile → toolchain.

name: azukar-webusb-flasher

services:
  toolchain:
    build:
      context: .
      dockerfile: toolchain/Dockerfile
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 64
    environment:
      BOARD: azukar-v2
      BOARDS_DIR: /boards
      COMPILE_BIND: 0.0.0.0
      COMPILE_PORT: 8090
      COMPILE_TIMEOUT_SEC: "90"
    volumes:
      - ./boards:/boards:ro
    tmpfs:
      - /tmp:size=256m,mode=1777
    expose:
      - "8090"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - toolchain
