# Un compose, un código. COMPILE_BACKEND en .env elige server vs yowasp (build).
#   copy .env.example .env
#   docker compose up --build -d
#
# Proyecto Docker: lattice-yowasp-* (no pisa lattice-webusb-flasher-* en :8080).

name: lattice-yowasp

services:
  toolchain:
    build:
      context: .
      dockerfile: toolchain/Dockerfile
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 64
    environment:
      BOARD: azukar-v2
      BOARDS_DIR: /boards
      COMPILE_BIND: 0.0.0.0
      COMPILE_PORT: 8090
      COMPILE_TIMEOUT_SEC: "90"
    volumes:
      - ./boards:/boards:ro
    tmpfs:
      - /tmp:size=256m,mode=1777
    expose:
      - "8090"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_COMPILE_BACKEND: ${COMPILE_BACKEND:-yowasp}
        VITE_ALLOWED_IMPORT_EXTENSIONS: ${ALLOWED_IMPORT_EXTENSIONS:-v,pcf,txt}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-9090}:80"
    depends_on:
      - toolchain
