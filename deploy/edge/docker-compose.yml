# Borde HTTPS compartido del VPS: TLS, HTTP->HTTPS y ruteo por dominio/path.
# `edge` llega solo al programador y `azukar-edge` solo a Azukar Toolbox.
#
#   docker network create edge               # una vez por VPS
#   docker network create azukar-edge        # una vez por VPS
#   cd deploy/edge && docker compose up -d
#
# Vive aparte a propósito: se levanta una vez y no se toca cuando actualizás
# una app. `docker compose up --build -d` de una app no reinicia esto ni el cert.

name: edge

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - azukar-edge

networks:
  edge:
    external: true
  azukar-edge:
    external: true

volumes:
  caddy_data:
  caddy_config:
