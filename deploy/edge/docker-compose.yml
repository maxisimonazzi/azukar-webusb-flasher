# Borde HTTPS del VPS. Uno solo para todo el dominio: TLS, HTTP->HTTPS y ruteo.
# No conoce ninguna app: solo nombres en la red `edge`.
#
#   docker network create edge      # una vez por VPS
#   cd deploy/edge && docker compose up -d
#
# Vive aparte a propósito: se levanta una vez y no se toca cuando actualizás
# una app. `docker compose up --build -d` de una app no reinicia esto ni el cert.

name: edge

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge

networks:
  edge:
    external: true

volumes:
  caddy_data:
  caddy_config:
